                  error_handler: DISCARD_VALUE
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var rows = JSON.parse(value);
                  rows.forEach(function (r) {
                      var idx = r['{#SNMPINDEX}'];
                      var m = idx.match(/^(\d+\.\d+\.\d+\.\d+)/);
                      r['{#DIRECTORIP}'] = m ? m[1] : '';
                  });
                  return JSON.stringify(rows);
