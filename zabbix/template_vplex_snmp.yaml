zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: ace1dbf040684615aadb18dda8f5bb4c
      name: Storage
  templates:
    - uuid: e684f324e5b249a495a31d72f07e25d8
      template: 'VPLEX SNMP'
      name: 'VPLEX SNMP'
      groups:
        - name: Storage
      items:
        - uuid: 3d9b5102b48642d5995351e7c2d09a71
          name: 'Director A - VPLEX added Read Latency'
          type: CALCULATED
          key: 'vplex.added.latency.read[A]'
          value_type: FLOAT
          units: '!ms'
          params: 'last(//vplex.fe.latency.read[A])-last(//vplex.be.latency.read[A])'
          tags:
            - tag: component
              value: diagnostic
            - tag: director
              value: A
          triggers:
            - uuid: 12c7edcfaa5e40e58d62e6c75b0aebb4
              expression: 'min(/VPLEX SNMP/vplex.added.latency.read[A],15m)>5'
              name: 'VPLEX: Director A - Latencia agregada por VPLEX en lectura (>5ms)'
              priority: WARNING
              description: 'VPLEX esta agregando mas de 5ms de latencia propia en lecturas (FE - BE) en el director A. El cuello de botella esta DENTRO de VPLEX, no en el array. Revisar cola FE, CPU del director y distribucion de carga.'
        - uuid: e7fd640b4e4d4005ab6478c589578fc8
