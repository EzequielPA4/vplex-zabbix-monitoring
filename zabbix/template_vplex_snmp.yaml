        - uuid: 62c854004ebb4db99076832abe27e3bd
          name: 'VPLEX VVol Aggregated Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#VOLNAME},1.3.6.1.4.1.1139.21.2.2.8.1.1]'
          key: vplex.vvol.agg.discovery
          delay: 1h
          lifetime: 30d
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1d
          item_prototypes:
            - uuid: b20dba7ab2d947be958ded0e4856b6b0
              name: 'VVol {#VOLNAME} - IOPS (total cluster)'
              type: CALCULATED
              key: 'vplex.vvol.iops.total[{#VOLNAME}]'
              value_type: FLOAT
              units: '!iops'
              params: 'sum(last_foreach(/*/vplex.vvol.iops[{#VOLNAME},*]))'
            - uuid: 217bd6802fca428db03b6e48e1034d32
              name: 'VVol {#VOLNAME} - Avg Read Latency (avg cluster)'
              type: CALCULATED
              key: 'vplex.vvol.latency.read.avg[{#VOLNAME}]'
              value_type: FLOAT
              units: '!ms'
              params: 'avg(last_foreach(/*/vplex.vvol.latency.read[{#VOLNAME},*]))'
              trigger_prototypes:
                - uuid: 55482aabc4754fbf97f1068ddd317c6d
                  expression: 'min(/VPLEX SNMP/vplex.vvol.latency.read.avg[{#VOLNAME}],10m)>150'
                  name: 'VPLEX: VVol {#VOLNAME} - Latencia de lectura alta (>150ms)'
                  priority: AVERAGE
                  description: 'Latencia de lectura del volumen {#VOLNAME} por encima de 150ms sostenida durante 10 minutos. Comparar contra ''VPLEX added latency'' para determinar si el origen es el array o VPLEX.'
            - uuid: 149278eba55842cab2829b54c57b59b8
              name: 'VVol {#VOLNAME} - Avg Write Latency (avg cluster)'
              type: CALCULATED
              key: 'vplex.vvol.latency.write.avg[{#VOLNAME}]'
              value_type: FLOAT
              units: '!ms'
              params: 'avg(last_foreach(/*/vplex.vvol.latency.write[{#VOLNAME},*]))'
              trigger_prototypes:
                - uuid: 35719a928f374f519705d59dbb581cbf
                  expression: 'min(/VPLEX SNMP/vplex.vvol.latency.write.avg[{#VOLNAME}],10m)>150'
                  name: 'VPLEX: VVol {#VOLNAME} - Latencia de escritura alta (>150ms)'
                  priority: AVERAGE
                  description: 'Latencia de escritura del volumen {#VOLNAME} por encima de 150ms sostenida durante 10 minutos.'
            - uuid: b6e0cb3853634135a525bf69e8aa534c
              name: 'VVol {#VOLNAME} - Read bytes (total cluster)'
              type: CALCULATED
              key: 'vplex.vvol.read.bytes.total[{#VOLNAME}]'
              value_type: FLOAT
              units: '!MB/s'
              params: 'sum(last_foreach(/*/vplex.vvol.read.bytes[{#VOLNAME},*]))'
            - uuid: cad012fb15c3454a8f9e16801958eb65
              name: 'VVol {#VOLNAME} - Write bytes (total cluster)'
              type: CALCULATED
              key: 'vplex.vvol.write.bytes.total[{#VOLNAME}]'
              value_type: FLOAT
              units: '!MB/s'
              params: 'sum(last_foreach(/*/vplex.vvol.write.bytes[{#VOLNAME},*]))'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var rows = JSON.parse(value);
                  var seen = {};
                  var out = [];
                  rows.forEach(function (r) {
                      var name = r['{#VOLNAME}'];
                      if (!seen[name]) {
                          seen[name] = true;
                          out.push({'{#VOLNAME}': name});
                      }
                  });
                  return JSON.stringify(out);
