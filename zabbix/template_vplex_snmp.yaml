              description: 'VPLEX esta agregando mas de 5ms de latencia propia en lecturas (FE - BE) en el director B. El cuello de botella esta DENTRO de VPLEX, no en el array. Revisar cola FE, CPU del director y distribucion de carga.'
        - uuid: 41fb5b462e34462f8f03817d2e23668e
